<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickOrder - Menú Digital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Encabezado Principal -->
    <header>
        <h1>QuickOrder – Menú Digital</h1>
    </header>

    <!-- Botones de Categorías -->
    <nav class="categorias">
        <a href="index.html" class="btn-categoria inicio">Inicio</a>
        <a href="hamburguesas.html" class="btn-categoria hamburguesas">Hamburguesas</a>
        <a href="perros.html" class="btn-categoria perros">Perros Calientes</a>
        <a href="salchipapas.html" class="btn-categoria salchipapas">Salchipapas</a>
        <a href="bebidas.html" class="btn-categoria bebidas">Bebidas</a>
    </nav>

    <!-- Sección de Productos -->
    <main class="seccion-platos">
        <h2 class="titulo-seccion">Platos Favoritos</h2>
        
        <div class="contenedor-platos">
            
            <!-- Plato 1: Hamburguesa -->
            <article class="tarjeta-plato">
                <img src="img/hamburguesa.jpg" alt="Hamburguesa Doble" class="imagen-plato">
                <h3 class="nombre-plato">Hamburguesa Doble</h3>
                <p class="precio-plato">$ 25000</p>
                <button class="btn-agregar" data-valor="25000" data-nombre="Hamburguesa Doble">Agregar el Pedido</button>
            </article>

            <!-- Plato 2: Perro Caliente -->
            <article class="tarjeta-plato">
                <img src="img/perro_caliente.jpg" alt="Perro Caliente Especial" class="imagen-plato">
                <h3 class="nombre-plato">Perro Especial</h3>
                <p class="precio-plato">$ 18000</p>
                <button class="btn-agregar" data-valor="18000" data-nombre="Perro Especial">Agregar el Pedido</button>
            </article>

            <!-- Plato 3: Salchipapa -->
            <article class="tarjeta-plato">
                <img src="img/salchipapa.jpg" alt="Salchipapa Familiar" class="imagen-plato">
                <h3 class="nombre-plato">Salchipapa Familiar</h3>
                <p class="precio-plato">$ 30000</p>
                <button class="btn-agregar" data-valor="30000" data-nombre="Salchipapa Familiar">Agregar el Pedido</button>
            </article>

            <!-- Plato 4: Bebida -->
            <article class="tarjeta-plato">
                <img src="img/bebida.jpg" alt="Gaseosa Fría" class="imagen-plato">
                <h3 class="nombre-plato">Gaseosa / Bebida</h3>
                <p class="precio-plato">$ 6000</p>
                <button class="btn-agregar" data-valor="6000" data-nombre="Gaseosa / Bebida">Agregar el Pedido</button>
            </article>

        </div>
    </main>

</body>

<script src="js/app.js"></script>

</html>
