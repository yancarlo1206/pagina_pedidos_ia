<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickOrder - Menú Digital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Encabezado Principal -->
    <header>
        <h1>QuickOrder – Menú de Salchipapas</h1>
    </header>

    <!-- Botones de Categorías -->
    <nav class="categorias">
        <a href="index.html" class="btn-categoria inicio">Inicio</a>
        <a href="hamburguesas.html" class="btn-categoria hamburguesas">Hamburguesas</a>
        <a href="perros.html" class="btn-categoria perros">Perros Calientes</a>
        <a href="salchipapas.html" class="btn-categoria salchipapas">Salchipapas</a>
        <a href="bebidas.html" class="btn-categoria bebidas">Bebidas</a>
    </nav>

    <!-- Sección de Productos -->
    <main class="seccion-platos">
        <h2 class="titulo-seccion">Platos Salchipapas</h2>
        
        <div class="contenedor-platos">
            
            <!-- Plato 1: Salchipapa Familiar -->
            <article class="tarjeta-plato" data-categoria="salchipapas">
                <img src="img/salchipapa.jpg" alt="Salchipapa Familiar" class="imagen-plato">
                <h3 class="nombre-plato">Salchipapa Familiar</h3>
                <p class="precio-plato">$ 30000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 2: Salchipapa Especial -->
            <article class="tarjeta-plato" data-categoria="salchipapas">
                <img src="img/salchipapa_especial.jpg" alt="Salchipapa Especial" class="imagen-plato">
                <h3 class="nombre-plato">Salchipapa Especial</h3>
                <p class="precio-plato">$ 35000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 3: Salchipapa Personal -->
            <article class="tarjeta-plato" data-categoria="salchipapas">
                <img src="img/salchipapa.jpg" alt="Salchipapa Personal" class="imagen-plato">
                <h3 class="nombre-plato">Salchipapa Personal</h3>
                <p class="precio-plato">$ 16000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 4: Salchipapa Costeña -->
            <article class="tarjeta-plato" data-categoria="salchipapas">
                <img src="img/salchipapa_especial.jpg" alt="Salchipapa Costeña" class="imagen-plato">
                <h3 class="nombre-plato">Salchipapa Costeña</h3>
                <p class="precio-plato">$ 28000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

        </div>
    </main>

</body>
</html>
