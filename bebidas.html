<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickOrder - Menú Digital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Encabezado Principal -->
    <header>
        <h1>QuickOrder – Menú de Bebidas</h1>
    </header>

    <!-- Botones de Categorías -->
    <nav class="categorias">
        <a href="index.html" class="btn-categoria inicio">Inicio</a>
        <a href="hamburguesas.html" class="btn-categoria hamburguesas">Hamburguesas</a>
        <a href="perros.html" class="btn-categoria perros">Perros Calientes</a>
        <a href="salchipapas.html" class="btn-categoria salchipapas">Salchipapas</a>
        <a href="bebidas.html" class="btn-categoria bebidas">Bebidas</a>
    </nav>

    <!-- Sección de Productos -->
    <main class="seccion-platos">
        <h2 class="titulo-seccion">Bebidas y Refrescos</h2>
        
        <div class="contenedor-platos">
            
            <!-- Plato 1: Gaseosa Fría -->
            <article class="tarjeta-plato" data-categoria="bebidas">
                <img src="img/bebida.jpg" alt="Gaseosa Fría" class="imagen-plato">
                <h3 class="nombre-plato">Gaseosa / Bebida</h3>
                <p class="precio-plato">$ 6000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 2: Limonada de Coco -->
            <article class="tarjeta-plato" data-categoria="bebidas">
                <img src="img/limonada_coco.jpg" alt="Limonada de Coco" class="imagen-plato">
                <h3 class="nombre-plato">Limonada de Coco</h3>
                <p class="precio-plato">$ 12000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 3: Jugo Natural -->
            <article class="tarjeta-plato" data-categoria="bebidas">
                <img src="img/bebida.jpg" alt="Jugo Natural" class="imagen-plato">
                <h3 class="nombre-plato">Jugo Natural</h3>
                <p class="precio-plato">$ 8000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 4: Cerveza Artesanal -->
            <article class="tarjeta-plato" data-categoria="bebidas">
                <img src="img/bebida.jpg" alt="Cerveza Artesanal" class="imagen-plato">
                <h3 class="nombre-plato">Cerveza Artesanal</h3>
                <p class="precio-plato">$ 10000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

        </div>
    </main>

</body>
</html>
