<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickOrder - Menú Digital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Encabezado Principal -->
    <header>
        <h1>QuickOrder – Menú de Hamburguesas</h1>
    </header>

    <!-- Botones de Categorías -->
    <nav class="categorias">
        <a href="index.html" class="btn-categoria inicio">Inicio</a>
        <a href="hamburguesas.html" class="btn-categoria hamburguesas">Hamburguesas</a>
        <a href="perros.html" class="btn-categoria perros">Perros Calientes</a>
        <a href="salchipapas.html" class="btn-categoria salchipapas">Salchipapas</a>
        <a href="bebidas.html" class="btn-categoria bebidas">Bebidas</a>
    </nav>

    <!-- Sección de Productos -->
    <main class="seccion-platos">
        <h2 class="titulo-seccion">Platos Hamburguesas</h2>
        
        <div class="contenedor-platos">
            
            <!-- Plato 1: Hamburguesa -->
            <article class="tarjeta-plato" data-categoria="hamburguesas">
                <img src="img/hamburguesa.jpg" alt="Hamburguesa Doble" class="imagen-plato">
                <h3 class="nombre-plato">Hamburguesa Doble</h3>
                <p class="precio-plato">$ 25000</p>
                <button class="btn-agregar" data-valor="25000">Agregar el Pedido</button>
            </article>

            <!-- Plato 2: Hamburguesa Doble -->
            <article class="tarjeta-plato" data-categoria="perros">
                <img src="img/hamburguesa_doble.webp" alt="Perro Caliente Especial" class="imagen-plato">
                <h3 class="nombre-plato">Hamburguesa Doble</h3>
                <p class="precio-plato">$ 38000</p>
                <button class="btn-agregar" data-valor="38000">Agregar el Pedido</button>
            </article>

            <!-- Plato 3: Hamburguesa Pollo -->
            <article class="tarjeta-plato" data-categoria="salchipapas">
                <img src="img/hamburguesa_pollo.jpg" alt="Salchipapa Familiar" class="imagen-plato">
                <h3 class="nombre-plato">Hamburguesa Pollo</h3>
                <p class="precio-plato">$ 30000</p>
                <button class="btn-agregar" data-valor="30000">Agregar el Pedido</button>
            </article>

            <!-- Plato 4: Hamburguesa Sencilla -->
            <article class="tarjeta-plato" data-categoria="bebidas">
                <img src="img/hamburguesa_sencilla.jpg" alt="Gaseosa Fría" class="imagen-plato">
                <h3 class="nombre-plato">Hamburguesa Sencilla</h3>
                <p class="precio-plato">$ 12000</p>
                <button class="btn-agregar" data-valor="12000">Agregar el Pedido</button>
            </article>

        </div>
    </main>

</body>
<script src="js/app.js"></script>
</html>
