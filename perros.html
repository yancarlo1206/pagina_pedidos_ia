<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickOrder - Menú Digital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Encabezado Principal -->
    <header>
        <h1>QuickOrder – Menú de Perros Calientes</h1>
    </header>

    <!-- Botones de Categorías -->
    <nav class="categorias">
        <a href="index.html" class="btn-categoria inicio">Inicio</a>
        <a href="hamburguesas.html" class="btn-categoria hamburguesas">Hamburguesas</a>
        <a href="perros.html" class="btn-categoria perros">Perros Calientes</a>
        <a href="salchipapas.html" class="btn-categoria salchipapas">Salchipapas</a>
        <a href="bebidas.html" class="btn-categoria bebidas">Bebidas</a>
    </nav>

    <!-- Sección de Productos -->
    <main class="seccion-platos">
        <h2 class="titulo-seccion">Platos Perros Calientes</h2>
        
        <div class="contenedor-platos">
            
            <!-- Plato 1: Perro Especial -->
            <article class="tarjeta-plato" data-categoria="perros">
                <img src="img/perro_caliente.jpg" alt="Perro Especial" class="imagen-plato">
                <h3 class="nombre-plato">Perro Especial</h3>
                <p class="precio-plato">$ 18000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 2: Perro Mexicano -->
            <article class="tarjeta-plato" data-categoria="perros">
                <img src="img/perro_mexicano.jpg" alt="Perro Mexicano" class="imagen-plato">
                <h3 class="nombre-plato">Perro Mexicano</h3>
                <p class="precio-plato">$ 22000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 3: Perro Suizo -->
            <article class="tarjeta-plato" data-categoria="perros">
                <img src="img/perro_suizo.jpg" alt="Perro Suizo" class="imagen-plato">
                <h3 class="nombre-plato">Perro Suizo</h3>
                <p class="precio-plato">$ 24000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

            <!-- Plato 4: Perro Clásico -->
            <article class="tarjeta-plato" data-categoria="perros">
                <img src="img/perro_caliente.jpg" alt="Perro Clásico" class="imagen-plato">
                <h3 class="nombre-plato">Perro Clásico</h3>
                <p class="precio-plato">$ 14000</p>
                <button class="btn-agregar">Agregar el Pedido</button>
            </article>

        </div>
    </main>

</body>
</html>
